run:
  name: bc_grimm_value
  output_dir: outputs/runs/bc_grimm_value

algorithm: bc

model:
  # 8/13・8/14まで学習済みの仕上げ版。#34(1046.1)に未使用2日を足したもので、
  # 勝ち試合での検証は#34をわずかに下回るが、最新のメタを見ている点を採る。
  # 方策は凍結するので、この方策がそのまま残る。
  initial_checkpoint: outputs/runs/bc_grimm_final/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # 勝ち試合143枚と負け試合147枚を混ぜた290枚。これまでの学習は「Grimmsnarlが勝った
  # 試合」しか採っておらず、自分のデッキが劣勢にある局面をモデルが一度も見ていなかった。
  # 勝率42.8%のデッキなので、実際には過半数の試合で負けている。
  # 負けだけを足すと価値の教師が-1に偏るため、勝ちと混ぜてラベルの均衡を保つ。
  shard_dir: data/bc/decks/grimm_all
  # 方策を凍結し`encoder_fc`の8,321パラメータだけを更新する。方策の出力はビット単位で
  # 不変になることをテストで固定してあるので、1046.1の実績を壊さない。
  # 負けた手を方策で真似ると、150手のうち敗因は1〜2手なのに全てへ負のラベルを付ける
  # ことになる。価値ヘッド経由なら「この局面は負けている」だけを学べ、MCTSが葉の評価で
  # 使うことで自然に悪手を避けられる。
  freeze_policy: true
  loser_policy_weight: 0.0
  val_day: "20260812"
  val_shards: 6
  holdout_shards: 1
  # 更新対象が8,321パラメータの小さなヘッドなので、通常の学習より大きく取れる。
  learning_rate: 0.0005
  rounds: 3
  batch_size: 256
  # 方策損失は勾配を持たないので、実質この係数が価値損失そのものの重みになる。
  value_loss_coef: 1.0
  warmup_steps: 200
