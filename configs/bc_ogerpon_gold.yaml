run:
  name: bc_ogerpon_gold
  output_dir: outputs/runs/bc_ogerpon_gold

algorithm: bc

model:
  # 第1段階(銀帯・複数構築の18枚で20エポック)の最良点 ep11(69.1% / 1.0893 / 0.1552)。
  # ep2で既に頭打ちで、以降は訓練損失だけが下がる過学習だった。
  initial_checkpoint: outputs/runs/bc_ogerpon/checkpoints/generalist_round11.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # 金帯(1100以上)がJaccard 0.9で使う単一構築だけ。提出するdeck.csvと完全に一致させ、
  # エンコーダへ入るデッキ情報を固定する。
  shard_dir: data/bc/gold/ogerpon_gold
  # 検証は8/13の1枚。最新日(8/14)まで学習に使いたいので、末尾ではなく日付で指定する。
  # 検証日より後のデータで学習する形になるため、これは「壊れていないか」の確認であって
  # 汎化性能の指標ではない。
  val_day: "20260813"
  val_shards: 1
  holdout_shards: 1
  loser_policy_weight: 0.0
  # 仕上げなので第1段階(1e-4)の1/5。既に得た方策を壊さず、金帯の構築へ寄せるに留める。
  learning_rate: 0.00002
  # 学習は7枚(約35万サンプル)しかない。第1段階で20エポック回した後でもあり、
  # 検証も7,322サンプルで±0.9%の誤差があるため、短く回して壊さないことを優先する。
  rounds: 3
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 200
