run:
  name: bc_06_dragapult
  output_dir: outputs/runs/bc_06_dragapult

algorithm: bc

model:
  initial_checkpoint: outputs/runs/bc_01_generalist/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # 金帯の最頻構築にJaccard 0.5で似た構築、勝者は900以上。
  shard_dir: data/bc/gold/dragapult_wide
  val_shards: 4
  holdout_shards: 4
  loser_policy_weight: 0.0
  learning_rate: 0.0001
  # Grimmsnarl特化の1/3のデータ量なので、エポックを増やして補う。
  rounds: 16
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 500
