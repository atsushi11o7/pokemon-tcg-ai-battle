run:
  name: bc_recent_value
  output_dir: outputs/runs/bc_recent_value

algorithm: bc

model:
  # bc_toplayers_v2 の最終チェックポイントを初期値にする。
  # 28日分で得た幅広い手筋を保ったまま、直近の分布へ寄せるのが狙い。
  initial_checkpoint: outputs/runs/bc_toplayers_v2/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  shard_dir: data/bc/shards_dated
  # 直近12日(8/01〜8/12)だけを使う。同じ重みでも検証精度は 7/16 で 66.2%、
  # 7/31 で 76.0% と10ポイント開いており、古い期間は分布が違う。
  # 幅はv2で確保済みなので、ここでは現在のメタへ合わせることに絞る。
  min_shard_day: "20260801"
  # 敗者の手を模倣する強さ(0.0=勝者のみ / 1.0=勝者と同等)。
  # このrunは敗者の教師を持たないシャードを使っており、勝者のみを模倣している。
  loser_policy_weight: 0.0
  val_shards: 4
  holdout_shards: 14
  # 仕上げなので短く。学習率もv2の1/6で、既に得た重みを壊さない範囲に留める。
  rounds: 3
  batch_size: 256
  learning_rate: 0.00005
  # bc_recent_finetune との唯一の違い。探索の質は価値関数に依存し、探索は実測で
  # +73.6点(#25 872.1 → #27 945.7)を稼ぐ最大のレバーだが、現在の価値ヘッドは
  # 真の勝敗に対する符号一致が78.3%に留まる。価値を重く見た版と対で比較する。
  value_loss_coef: 0.5
  warmup_steps: 200
