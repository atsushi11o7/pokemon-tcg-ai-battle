run:
  name: bc_v3_quality_days
  output_dir: outputs/runs/bc_v3_quality_days

algorithm: bc

model:
  # v2の最終重み(検証精度73.9%、ラダー実測 Grimmsnarl 1006〜1014)から続ける。
  # 重みだけを引き継ぎ、optimizerのモーメントとスケジューラはここで初期化される。
  initial_checkpoint: outputs/runs/bc_toplayers_v2/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  # 全エポックを残す。検証精度が基準を下回ったら前のエポックへ戻れるようにするため。
  keep_last_checkpoints: 0

training:
  shard_dir: data/bc/shards_dated
  # 6/16〜7/05 は勝者レートの中央値が637〜835で、現在の自分(約1006)より弱い手本になる。
  # 7/06 を境に金圏の勝者が現れ、中央値も849〜1064へ上がる。質が落ちる期間は混ぜない。
  min_shard_day: "20260706"
  # 敗者の手は模倣しない。入力に「手本の質」を伝える枠が無いため、混ぜると
  # 質の違う教師が見分けのつかないまま平均化される。
  loser_policy_weight: 0.0
  # 最新日(2026-08-13)を丸ごと学習から外し、うち先頭4枚を検証に読む。
  val_shards: 4
  holdout_shards: 14
  # v2のピーク3e-4に対して1/6。既存の重みを壊さずに追加分を吸収できる範囲を狙う。
  # コサインで最終2.5e-6まで絞る(v2終端1.5e-5の0.17倍)。
  learning_rate: 0.00005
  rounds: 3
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 500
