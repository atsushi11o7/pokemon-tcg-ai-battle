run:
  name: mcts_from_bc
  output_dir: outputs/runs/mcts_from_bc

algorithm: mcts

model:
  initial_checkpoint: outputs/runs/bc_toplayers/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 12
  game_timeout_seconds: 240
  round_timeout_seconds: 3600
  max_restarts: 50
  retry_delay_seconds: 5
  keep_last_checkpoints: 5

training:
  selfplay_mode: generalist
  deck_path: null
  games_per_round: 100
  rounds: 30
  search_count: 200
  num_determinizations: 2
  # 価値ヘッド(encoder_fc, 8,321パラメータ)だけを更新する。方策は模倣学習の重みのまま不変。
  freeze_policy: true
  # 更新対象が小さい線形ヘッドなので、通常の全体更新より大きく取れる。
  learning_rate: 0.001
  batch_size: 64
  epochs_per_round: 3
  eval_games_per_round: 32
  baseline_eval_games: 8
  gating_win_rate: 0.5
  checkpoint_pool_size: 3
  gating_pool_sample: 2
  replay_buffer_rounds: 5
