run:
  name: bc_dragapult_gold
  output_dir: outputs/runs/bc_dragapult_gold

algorithm: bc

model:
  # 第1段階(銀帯・複数構築の47枚で16エポック)の最良点。ep16は方策損失が0.8963へ
  # 悪化していたので、ep11(73.0% / 0.8611 / 0.1775)を採る。
  initial_checkpoint: outputs/runs/bc_dragapult/checkpoints/generalist_round11.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # 金帯(1100以上)がJaccard 0.9で使う単一構築だけ。提出するdeck.csvと完全に一致させ、
  # エンコーダへ入るデッキ情報を固定する。#34で価値損失が0.1311まで落ちたのと同じ条件。
  shard_dir: data/bc/gold/dragapult_gold
  # 検証は8/13の1枚。最新日(8/14)まで学習に使いたいので、末尾ではなく日付で指定する。
  # 検証日より後のデータで学習する形になるため、これは「壊れていないか」の確認であって
  # 汎化性能の指標ではない。
  val_day: "20260813"
  val_shards: 1
  holdout_shards: 1
  loser_policy_weight: 0.0
  # 仕上げなので第1段階(1e-4)の1/5。既に得た方策を壊さず、金帯の構築へ寄せるに留める。
  learning_rate: 0.00002
  # 17シャード(約85万サンプル)と少ない。第1段階で16エポック回した後なので短く。
  rounds: 4
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 200
