run:
  name: ppo_generalist
  output_dir: outputs/runs/ppo_generalist

algorithm: ppo

model:
  initial_checkpoint: outputs/saved_checkpoints/generalist_round250.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 4
  game_timeout_seconds: 300
  round_timeout_seconds: 1800
  max_restarts: 50
  retry_delay_seconds: 5

training:
  selfplay_mode: generalist
  deck_path: null
  games_per_round: 500
  rounds: 200
  learning_rate: 0.0001
  minibatch_size: 64
  epochs_per_round: 4
  target_kl: 0.02
  gamma: 1.0
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.001
  max_grad_norm: 1.0
  eval_games_per_round: 12
