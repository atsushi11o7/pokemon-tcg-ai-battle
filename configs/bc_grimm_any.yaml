run:
  name: bc_grimm_any
  output_dir: outputs/runs/bc_grimm_any

algorithm: bc

model:
  # #34(ラダー実績1046.1、提出物中で最高)の重み。方策はこの実績を土台にして、
  # 価値ヘッドだけを作り直すのではなく両方を新しい教師で動かす。
  # #39は方策を凍結して価値だけ直したが622.4まで落ちた。凍結した方策は
  # 「常に+1を返す価値ヘッド」と組で調整されたもので、片方だけ差し替えると
  # 探索の中で噛み合わなくなると考えられる。今回は両方を同じ教師で動かす。
  initial_checkpoint: outputs/runs/bc_grimmsnarl/checkpoints/generalist_round11.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # `--side any --policy-on-deck`で抽出し直した集合(7/16〜8/15)。
  # 従来は「Grimmsnarlが勝った試合」しか採っておらず、方策の教師は勝者=自分の手だけ、
  # 価値の-1ラベルは「自分が勝った試合での相手の局面」だった。つまり
  # 「自分のデッキが負けている局面」をモデルは一度も見ていない。
  # #38の価値ヘッドが符号正答率10.9%(ほぼ反転)だったのはこれが原因。
  # 新しい集合では席を特定して教師を付けるので、負けた試合からも自分の指し手が取れる。
  # 実測(8/01の1シャード)で方策の教師は53%→78%に増え、うち49%が負け試合。
  # 価値の教師も勝ち53.8%/負け46.2%で、-1が自分の劣勢局面を指すようになった。
  shard_dir: data/bc/decks/grimm_any
  # 既定は1.0(短絡してそのまま返す)。0.0にすると`label<0`のサンプルの方策教師が
  # 全て消える実装なので、今回集めた負け試合の指し手が丸ごと無効になる。
  # 150手のうち敗因は数手で、残りは上位者の妥当な操作。同等の重みで使う。
  loser_policy_weight: 1.0
  freeze_policy: false
  # 8/12を検証に固定。#34・#38・#39と同じ日で測って比較できるようにする。
  # 見たいのは方策精度より価値の符号正答率で、これが10.9%から改善するかが本題。
  val_day: "20260812"
  val_shards: 4
  holdout_shards: 1
  # #34の学習時と同じ1e-4。データが倍近くに増え教師の性質も変わったので、
  # 仕上げ(2e-5)ではなく本学習の刻みで動かす。
  learning_rate: 0.0001
  # 約300シャードで1エポック40分強。締切から逆算して6エポック。
  rounds: 6
  batch_size: 256
  # #34は0.1だった。価値ヘッドを作り直すのが今回の主目的なので上げるが、
  # 実績のある方策を壊さないよう共有トランクへの影響は抑えめに留める。
  value_loss_coef: 0.3
  warmup_steps: 500
