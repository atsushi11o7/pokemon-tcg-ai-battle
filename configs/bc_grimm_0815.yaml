run:
  name: bc_grimm_0815
  output_dir: outputs/runs/bc_grimm_0815

algorithm: bc

model:
  # #38(ラダー1043.3、提出物中の最高)の重み。#38は#34(1046.1)に8/13・8/14を
  # 2e-5で4エポック足したもので、系譜としては bc_v3 -> #34 -> #38 と続く。
  # ここへ8/15だけを同じやり方で足す。
  initial_checkpoint: outputs/runs/bc_grimm_final/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # #38と同じディレクトリ。同じ条件(Jaccard>=0.5・勝者レート907.3以上・
  # Grimmsnarlが勝った試合のみ)で8/15を抽出して足した145シャード。
  # 8/15は#38が一度も見ていない唯一のデータで、狙いはそこだけ。
  shard_dir: data/bc/decks/grimmsnarl
  # #38と同じ。8/12を検証に回し、8/13〜8/15を全部学習へ入れる。
  # #38が学習済みの日なので汎化の指標にはならず、壊れていないかの確認に使う。
  val_day: "20260812"
  val_shards: 3
  holdout_shards: 1
  # #38と同じ。勝った試合の勝者側だけが方策の教師。
  loser_policy_weight: 0.0
  # #38と同じ2e-5。実績1043.3の方策を壊さない範囲に留める。
  learning_rate: 0.00002
  # #38は4エポックだった。ここで足すのは8/15の1日分だけなので短く。
  rounds: 3
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 200
