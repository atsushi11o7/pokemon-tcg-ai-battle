run:
  name: bc_04_grimmsnarl_topup
  output_dir: outputs/runs/bc_04_grimmsnarl_topup

algorithm: bc

model:
  initial_checkpoint: outputs/runs/bc_03_grimmsnarl/checkpoints/generalist_round11.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # bc_03と同じディレクトリ。bc_03がholdoutで外した最新日を学習へ入れ直す。
  shard_dir: data/bc/decks/grimmsnarl
  # 検証日を明示して、それより新しい日を全て学習へ回す。
  # bc_03が学習済みの日なので、汎化ではなく「壊れていないか」の確認に使う。
  val_day: "20260812"
  val_shards: 3
  holdout_shards: 1
  loser_policy_weight: 0.0
  # 仕上げなのでbc_03(1e-4)の1/5に留める。
  learning_rate: 0.00002
  rounds: 4
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 200
