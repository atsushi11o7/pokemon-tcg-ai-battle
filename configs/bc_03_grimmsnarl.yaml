run:
  name: bc_03_grimmsnarl
  output_dir: outputs/runs/bc_03_grimmsnarl

algorithm: bc

model:
  initial_checkpoint: outputs/runs/bc_02_quality_days/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  keep_last_checkpoints: 0

training:
  # Grimmsnarl系の構築(Jaccard 0.5以上)で、勝者が銀圏以上のエピソードだけ。
  # 提出するのはこのデッキだけなので、他のデッキを学ぶ必要がない。
  shard_dir: data/bc/decks/grimmsnarl
  # デッキを絞ると1日あたりのシャードが数枚になるため、混合時の14から下げる。
  val_shards: 3
  holdout_shards: 3
  loser_policy_weight: 0.0
  learning_rate: 0.0001
  rounds: 12
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 500
