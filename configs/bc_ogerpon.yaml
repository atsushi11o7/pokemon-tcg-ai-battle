run:
  name: bc_ogerpon
  output_dir: outputs/runs/bc_ogerpon

algorithm: bc

model:
  # v2から始める。同時提出した対照で v2ep9=969.7 に対し v3=876〜910 と、v2が上と確定した。
  initial_checkpoint: outputs/runs/bc_toplayers_v2/checkpoints/final.pt

data:
  sampling_snapshot: data/meta/derived/sampling_snapshot.json

runtime:
  seed: 0
  workers: 2
  max_restarts: 5
  retry_delay_seconds: 5
  # 全エポックを残す。データが少なく途中でピークを打つ可能性があるため、
  # 後から検証精度の最良点を選べるようにしておく。
  keep_last_checkpoints: 0

training:
  # 金帯の最頻構築(8/14で181席・勝率58.6%)にJaccard 0.5で似た構築、勝者は900以上。
  # Ogerpon系は相方がHydrapple/Venusaur/Arbolivaと分岐するが、主力(Ogerpon×4 +
  # Meganium×2)と骨格は共通で、入れ替わるのは6枚前後。0.5なら派生をまとめて拾える。
  shard_dir: data/bc/gold/ogerpon_wide
  val_shards: 2
  # 最新日(2026-08-14)は2シャード。丸ごと学習から外して検証に使う。
  holdout_shards: 2
  loser_policy_weight: 0.0
  # v2はOgerponをほとんど知らない。検証精度65.3%は3デッキ中で最も低く、伸びしろが大きい。
  learning_rate: 0.0001
  # 16シャード(約80万サンプル)。Dragapult(47枚)の4割しかないので、データ量に比例して
  # エポックを増やすと確実に過学習する。20で頭打ちにして、最良点は後から選ぶ。
  rounds: 20
  batch_size: 256
  value_loss_coef: 0.1
  warmup_steps: 500
